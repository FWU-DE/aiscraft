# .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com). Run by package.sh, which stages
# the file tree, substitutes its path for ${STAGE} (nfpm doesn't expand env vars in `src`) and
# exports VERSION and NFPM_ARCH.
name: aischatcraft
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
# semver: 0.2.0-rc.1 becomes 0.2.0~rc.1 in deb/rpm, so pre-releases sort before the release.
version_schema: semver
release: 1
section: net
priority: optional
maintainer: ${AISCHATCRAFT_MAINTAINER}
vendor: FWU
homepage: https://github.com/FWU-DE/aiscraft
license: MIT OR Apache-2.0
description: |-
  Nativer Desktop-Client für AIS.chat und weitere KI-Dienste (OpenAI-kompatible
  Server, Claude). Mit aiscraft-cli (Kommandozeile, MCP-Server) und
  aiscraft-preview (Vorschau für Lern-Apps).

# The app links GTK 3 (file dialogs), D-Bus (keychain through the Secret Service) and ALSA; the
# preview links WebKitGTK 4.1. Windowing (X11/Wayland, xkbcommon) and the GPU are loaded at run
# time.
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
      - libasound2 | libasound2t64
      - libdbus-1-3
      - libgtk-3-0 | libgtk-3-0t64
      - libwebkit2gtk-4.1-0
      - libxkbcommon0
      - libvulkan1 | libegl1
    recommends:
      - libwayland-client0
      - libx11-6
      - libxcursor1
      - libxi6
      - libxrandr2
      - mesa-vulkan-drivers
      - xdg-desktop-portal
      - gnome-keyring | kwalletmanager
  rpm:
    depends:
      - alsa-lib
      - dbus-libs
      - gtk3
      - webkit2gtk4.1
      - libxkbcommon
      - (vulkan-loader or libglvnd-egl)
    recommends:
      - libwayland-client
      - libX11
      - libXcursor
      - libXi
      - libXrandr
      - mesa-vulkan-drivers
      - xdg-desktop-portal

contents:
  - src: ${STAGE}/usr/bin/
    dst: /usr/bin/
    type: tree
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
