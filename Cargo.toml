[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
aiscraft-core = { path = "crates/core" }
aiscraft-rsc = { path = "crates/rsc" }
aiscraft-store = { path = "crates/store" }
aiscraft-backends = { path = "crates/backends" }
aiscraft-engine = { path = "crates/engine" }
aiscraft-ui = { path = "crates/ui" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart", "cookies", "http2"] }
rusqlite = { version = "0.37", features = ["bundled"] }
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "apple-native", "windows-native"] }
directories = "6"
regex = "1"
log = "0.4"
env_logger = "0.11"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
egui_commonmark = { version = "0.26", features = ["better_syntax_highlighting"] }
rfd = "0.17"
arboard = "3"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
