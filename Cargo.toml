[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
# Nothing here goes to crates.io (cargo-deny then accepts dependencies by path without a version).
publish = false

[workspace.dependencies]
aiscraft-core = { path = "crates/core" }
aiscraft-rsc = { path = "crates/rsc" }
aiscraft-store = { path = "crates/store" }
aiscraft-backends = { path = "crates/backends" }
aiscraft-engine = { path = "crates/engine" }
aiscraft-ui = { path = "crates/ui" }

# Shared Craft libraries (storytold/craft-libs, docs/craft-libs.md). One pin for all of them:
# craft-libs has no release tag yet, so this is a full commit of main. Update every entry together.
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
craft-jsonrpc = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
craft-mcp = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
craft-control-protocol = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
craft-math = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
craft-dialogs = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
# Office files and PDF (#38): Word and PDF export, spreadsheets and slides from model tools.
craft-markdown = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
craft-docx = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
craft-xlsx = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
craft-pptx = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
craft-zip = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
craft-opc = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
craft-xml = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
craft-wordmodel = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
craft-pdf = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd", features = ["fonts", "cos"] }
# Release check only (`check_for_update`); no egui dialogs, no self-update yet.
craft-update = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }

# Attachments prepared locally before upload (#45, #47, #50): old Office files, RTF, EPUB, mail,
# calendars, contacts and HEIC/AVIF photos become Markdown, CSV or JPEG; photos lose their metadata.
craft-doc-binary = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
craft-xls = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
craft-ppt-binary = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
craft-rtf = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd", features = ["doc"] }
craft-epub = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
craft-html = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd", features = ["flow"] }
craft-mime = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
craft-ical = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
craft-dav = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
craft-vcard = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
craft-csv = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
craft-ods = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
craft-metadata = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
craft-image-codecs = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd", features = ["avif-decode"] }
craft-heif = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
# German hyphenation points as a syllable count for the readability of an answer (#48).
craft-text = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd", default-features = false, features = ["hyphen", "german"] }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs", "process"] }
# native roots next to the bundled ones: a school or company CA from the system store
# (TLS-inspecting proxies). The Windows proxy setting: `system-proxy` in crates/backends (Windows only).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json", "stream", "multipart", "cookies", "http2"] }
rusqlite = { version = "0.41", features = ["bundled"] }
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "apple-native", "windows-native"] }
directories = "6"
regex = "1"
log = "0.4"
env_logger = "0.11"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "system_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_commonmark = { version = "0.26", features = ["better_syntax_highlighting"] }
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

# The storytold egui and winit forks every Craft app builds with, the same revs as craft-libs'
# own root Cargo.toml (a git dependency's patches don't reach us). Bump them with the craft-libs pin.
[patch.crates-io]
# craft-pdf renders with craft-libs' patched hayro and vello (its own [patch] does not reach us).
hayro = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
hayro-cmap = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
hayro-postscript = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
vello_common = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
vello_cpu = { git = "https://github.com/storytold/craft-libs", rev = "c0977ad6125f1b88ee717b9c23a6340f41b0a8dd" }
ecolor = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
emath = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
egui = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
