name: CI

# Tests and builds AIS.ChatCraft on Linux, macOS and Windows. Every run uploads the release binaries
# of all three as artifacts; a pushed tag `v*` also attaches them to a draft GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Line tables keep file:line in panic backtraces; the rest of the debug info only costs build
  # time and disk (Windows PDBs most of all).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# A newer push to a pull request cancels its older run; runs on main and tags always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-24.04 }
          - { name: macos, os: macos-15 }
          - { name: windows, os: windows-2025 }
    steps:
      - uses: actions/checkout@v4

      # egui/winit (X11, Wayland, GL), rfd (GTK file dialogs), cpal (ALSA), keyring (D-Bus Secret
      # Service), WebKitGTK 4.1 (aiscraft-preview, the learning-app window), and Mesa's software
      # Vulkan driver so the kittest UI tests get a wgpu adapter.
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libgl1-mesa-dev libgtk-3-dev libasound2-dev libdbus-1-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Only main saves caches; pull requests restore main's, so the 10 GB budget is not spent on
      # per-branch copies.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  build:
    name: build (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { name: macos-arm64, os: macos-15, target: aarch64-apple-darwin }
          - { name: macos-x86_64, os: macos-15, target: x86_64-apple-darwin }
          - { name: windows-x86_64, os: windows-2025, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libgl1-mesa-dev libgtk-3-dev libasound2-dev libdbus-1-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p aiscraft -p aiscraft-cli -p aiscraft-collab-server -p aiscraft-preview

      - name: Package
        shell: bash
        env:
          NAME: aischatcraft-${{ matrix.name }}
          TARGET: ${{ matrix.target }}
          OS: ${{ runner.os }}
        run: bash packaging/ci-package.sh

      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          "target/${{ matrix.target }}/release/aiscraft-cli$ext" --version

      - uses: actions/upload-artifact@v4
        with:
          name: aischatcraft-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber -- *
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "AIS.ChatCraft ${TAG#v}" --generate-notes -- *
          fi
