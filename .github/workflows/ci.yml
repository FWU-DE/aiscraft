name: CI

# Tests AIS.ChatCraft on Linux, macOS and Windows. Release packages: release.yml (tags `v*`).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Line tables keep file:line in panic backtraces; the rest of the debug info only costs build
  # time and disk (Windows PDBs most of all).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# A newer push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-24.04 }
          - { name: macos, os: macos-15 }
          - { name: windows, os: windows-2025 }
    steps:
      - uses: actions/checkout@v4

      # egui/winit (X11, Wayland, GL), rfd (GTK file dialogs), cpal (ALSA), keyring (D-Bus Secret
      # Service), WebKitGTK 4.1 (aiscraft-preview, the learning-app window), and Mesa's software
      # Vulkan driver so the kittest UI tests get a wgpu adapter.
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          # A runner sometimes gets only some package lists (2026-11-24: only Microsoft's), and
          # every install then fails with "Unable to locate package"; retry the whole step.
          for i in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libgl1-mesa-dev libgtk-3-dev libasound2-dev libdbus-1-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev mesa-vulkan-drivers && break
            echo "apt failed, retry $i"; sleep 15
          done
          dpkg -s libwebkit2gtk-4.1-dev libgtk-3-dev >/dev/null

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Only main saves caches; pull requests restore main's, so the 10 GB budget is not spent on
      # per-branch copies.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # The release scripts run only on tags (release.yml); check them on every push.
  packaging:
    name: packaging scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        working-directory: packaging
        run: shellcheck -x env.sh linux/*.sh macos/*.sh
      - name: Desktop entry and AppStream data
        run: |
          sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends desktop-file-utils appstream libxml2-utils
          desktop-file-validate packaging/linux/ai.uds.aischatcraft.desktop
          sed -e 's/@VERSION@/0.0.0/' -e 's/@DATE@/2026-01-01/' packaging/linux/ai.uds.aischatcraft.metainfo.xml.in > /tmp/metainfo.xml
          appstreamcli validate --no-net --explain /tmp/metainfo.xml
          xmllint --noout packaging/macos/*.plist packaging/macos/Info.plist.in packaging/windows/aischatcraft.wxs
