name: Sandbox-Abbild

# Builds the image of „Eigener Rechner (Sandbox)“ (#94) with packaging/sandbox/build.sh and, when
# asked, publishes it on its own release tag (sandbox-v<LAYOUT>) with SHA256SUMS.txt. The app
# downloads it from there only after the owner's explicit yes and imports it as its own WSL2
# distribution (crates/engine/src/sandbox).
#
# - Run it by hand ("Run workflow"). Without "publish" it only builds and keeps the image as a
#   workflow artifact for a look (and for the ignored live test, AISCRAFT_SANDBOX_IMAGE).
# - A published tag is never replaced: a changed image gets a new LAYOUT in build.sh and a new
#   ASSET_X86_64 / TAG in crates/engine/src/sandbox/image.rs.
# - The release is a pre-release and never "latest", so the app's update check never mistakes it
#   for a new app version.
# - After the first publish, put the printed SHA-256 into PINNED_SHA256 in
#   crates/engine/src/sandbox/image.rs, so the app also refuses a replaced asset.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Als Release veröffentlichen (Tag sandbox-v<Layout>)"
        type: boolean
        default: false

concurrency:
  group: sandbox-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Sandbox-Abbild bauen
    runs-on: ubuntu-24.04
    # The build (build.sh, package downloads) runs with read rights only and without a stored
    # token; only the job `publish` can write, and it runs no code from the repository.
    permissions:
      contents: read
    outputs:
      asset: ${{ steps.sum.outputs.asset }}
      sha256: ${{ steps.sum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bauen
        run: bash packaging/sandbox/build.sh --out dist/sandbox
      - name: Prüfsumme
        id: sum
        run: |
          cat dist/sandbox/SHA256SUMS.txt
          echo "sha256=$(cut -d' ' -f1 dist/sandbox/SHA256SUMS.txt)" >> "$GITHUB_OUTPUT"
          echo "asset=$(ls dist/sandbox/*.tar.gz | xargs -n1 basename)" >> "$GITHUB_OUTPUT"
          {
            echo "### Sandbox-Abbild"
            echo
            echo "\`$(cat dist/sandbox/SHA256SUMS.txt)\`"
            echo
            echo "Größe: $(du -m dist/sandbox/*.tar.gz | cut -f1) MB"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-image
          path: dist/sandbox/
          retention-days: 7
          compression-level: 0

  publish:
    name: Sandbox-Abbild veröffentlichen
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sandbox-image
          path: dist/sandbox/
      - name: Veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASSET: ${{ needs.build.outputs.asset }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          layout="${ASSET#aiscraft-sandbox-}"
          layout="${layout%%-*}"
          tag="sandbox-v${layout}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::$tag gibt es schon. Ein veröffentlichtes Abbild wird nie ersetzt; für ein neues LAYOUT erhöhen."
            exit 1
          fi
          cat > notes.md <<EOF
          Abbild für „Eigener Rechner (Sandbox)“ in AIS.ChatCraft (#94): Ubuntu 24.04 mit Docker Engine und dem
          Arbeitsbereich (LibreOffice, Python 3, qpdf, Ghostscript, Noto-Schriften). AIS.ChatCraft lädt es nur auf
          ausdrücklichen Wunsch und richtet es unter Windows als eigene WSL2-Distribution ein.

          **Lizenzen:** freie Software aus den Ubuntu-Archiven (überwiegend GPL; Docker Apache-2.0, LibreOffice MPL-2.0,
          Ghostscript AGPL-3.0, Noto OFL-1.1). Lizenztexte im Abbild unter /usr/share/doc, Hinweise in /opt/aiscraft/NOTICE.txt.

          SHA-256 von \`${ASSET}\`: \`${SHA256}\`

          Kein App-Release.
          EOF
          gh release create "$tag" dist/sandbox/"$ASSET" dist/sandbox/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Sandbox-Abbild ${layout}" --notes-file notes.md --prerelease --latest=false
