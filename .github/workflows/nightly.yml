name: Nightly

# Once a day: if main has a commit no release was made from and CI is green on it, build every
# package (release.yml) as `<next>-nightly.<YYYYMMDD>` and publish it as a GitHub pre-release.
#
# - Version: Cargo.toml's version stays as it is. Once `v<version>` is released the nightly counts
#   towards the next patch (0.1.0 released -> 0.1.1-nightly.20261126), else towards the version
#   itself, so a nightly is always newer than the last release and older than the next. Semver
#   orders 0.1.1-nightly.* below 0.1.1, so craft-update offers the next release to nightly users,
#   and it never offers a pre-release to everyone else (update.rs asks for stable releases only).
# - The tag `v<version>` is made by publishing the release, at the commit that was built. A tag
#   pushed with GITHUB_TOKEN would not start release.yml, so this workflow calls it directly.
# - Only the newest 7 nightlies are kept; older nightly releases and their tags are deleted.
#   Stable releases are never touched.
on:
  schedule:
    - cron: "30 2 * * *" # 03:30 CET / 04:30 CEST
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Anything new and green?
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          skip() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; echo "build=false" >>"$GITHUB_OUTPUT"; exit 0; }

          released="$(git tag --points-at "$SHA" --list 'v*' | head -1)"
          [ -z "$released" ] || skip "Nothing new: ${SHA::9} is already released as $released."

          ci="$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success" --jq '.total_count')"
          [ "$ci" -gt 0 ] || skip "No nightly: CI has not passed on ${SHA::9} (yet)."

          . packaging/env.sh
          base="$VERSION"
          if git rev-parse -q --verify "refs/tags/v$base" >/dev/null; then
            IFS=. read -r major minor patch <<<"${base%%-*}"
            base="$major.$minor.$((patch + 1))"
          fi
          version="$base-nightly.$(date -u +%Y%m%d)"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null || gh release view "v$version" >/dev/null 2>&1; then
            skip "No nightly: v$version exists already (one per day)."
          fi
          echo "Building v$version from ${SHA::9}." | tee -a "$GITHUB_STEP_SUMMARY"
          { echo "build=true"; echo "version=$version"; } >>"$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.plan.outputs.version }}

  prune:
    name: Keep the newest 7 nightlies
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          gh release list --limit 200 --json tagName,isDraft,createdAt \
            --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\.[0-9]+$")) | select(.isDraft | not)] | sort_by(.createdAt) | reverse | .[7:] | .[].tagName' |
            while read -r tag; do
              echo "Deleting $tag"
              gh release delete "$tag" --yes --cleanup-tag
            done
