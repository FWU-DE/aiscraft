name: Release

# Release packages come from the Craft suite's shared workflow
# (storytold/craft-common-actions, .github/workflows/release.yml), like the other Craft apps: our
# packaging/ scripts build them, the shared jobs install WiX, nfpm and flatpak-builder. Asset names
# follow craft-update's scheme, `aischatcraft-<version>-<os>-<arch>.<ext>`.
#
# For now without macOS and without signing: the shared workflow's macOS job needs a paid larger
# runner (macos-15-xlarge) and signing needs certificates we don't have yet. So we call it in its
# dry-run mode (every Linux, Flatpak and Windows package, no macOS, no signing, no draft) and the
# job `publish` below makes the release from those packages with the suite's draft-release action
# (SHA256SUMS.txt included). Once the runner and the certificates are there, drop `publish`, pass
# `dry-run` through again and list the signing secrets (see git history), as the other apps do.
#
# A pushed tag `v<version>` builds and publishes the release; the tag must match
# `[workspace.package] version` in Cargo.toml. "Run workflow" builds the packages; with dry-run
# off it also leaves a draft release, unpublished. nightly.yml calls this workflow with a
# `version` (e.g. 0.1.1-nightly.20261126): the shared jobs set it with `cargo xtask version set`,
# and publishing the pre-release creates its tag at the built commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and check only, no draft release"
        type: boolean
        default: true
      version:
        description: "Build this version instead of Cargo.toml's (e.g. 0.1.1-rc.1); without dry-run it is published"
        type: string
        default: ""
  workflow_call:
    inputs:
      version:
        description: "Version to build and publish instead of Cargo.toml's (a pre-release such as 0.1.1-nightly.20261126)"
        type: string
        required: true
    outputs:
      version:
        description: "The version that was built"
        value: ${{ jobs.release.outputs.version }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The release is named after Cargo.toml's version, not after the tag.
  tag:
    name: Tag matches Cargo.toml
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Compare
        env:
          TAG: ${{ github.ref_name }}
        run: |
          . packaging/env.sh
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match the version in Cargo.toml (v$VERSION). Set [workspace.package] version, commit, and tag that commit."
            exit 1
          fi

  release:
    needs: tag
    # Runs after `tag` passed, or without it on "Run workflow".
    if: ${{ !cancelled() && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    # GitHub checks the called workflow's job permissions against these even for jobs the dry run
    # skips (its draft and its Flatpak OCI push).
    permissions:
      contents: write
      packages: write
    # Tracked at @main like every Craft app, so suite-wide fixes arrive without a pull request here.
    uses: storytold/craft-common-actions/.github/workflows/release.yml@main
    with:
      app-name: aiscraft
      app-title: AIS.ChatCraft
      # Empty except when nightly.yml calls: then Cargo.toml's version is replaced for the build.
      version: ${{ inputs.version || '' }}
      # Always: skips macOS and signing (see above); `publish` makes the release.
      dry-run: true
      # Desktop only: no WebAssembly build, no FreeBSD and RISC-V builds (WebKitGTK, cross deps).
      has-web: false
      has-freebsd: false
      has-riscv64: false
      # The shared Arch package can't declare webkit2gtk-4.1 and gtk3; packaging/PKGBUILD does.
      has-arch: false

  publish:
    name: GitHub Release
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.dry-run) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Draft with every package and SHA256SUMS.txt
        uses: storytold/craft-common-actions/actions/draft-release@main
        with:
          version: ${{ needs.release.outputs.version }}
          app-title: AIS.ChatCraft
          prerelease: ${{ needs.release.outputs.prerelease }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish on a tag or a nightly
        if: github.ref_type == 'tag' || inputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.release.outputs.version }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
        run: |
          count="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          # Linux x86_64/aarch64 (AppImage, zsync, deb, rpm, tar.gz), Flatpak, Windows x64/arm64
          # (msi, portable zip) and SHA256SUMS.txt: 15 or more when every job delivered.
          if [ "$count" -lt 10 ]; then
            echo "::error::$TAG has only $count files; it stays a draft."
            exit 1
          fi
          # A pre-release (nightly) never becomes "latest": the update check and the AppImage's
          # zsync link read the latest release only.
          if [ "$PRERELEASE" = "true" ]; then latest=false; else latest=true; fi
          gh release edit "$TAG" --draft=false --latest="$latest"
          echo "Published $TAG with $count files." >>"$GITHUB_STEP_SUMMARY"
