[package]
name = "aiscraft"
description = "AIS.ChatCraft desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
craft-atomic.workspace = true
craft-control-protocol.workspace = true
aiscraft-engine.workspace = true
aiscraft-ui.workspace = true
eframe.workspace = true
egui.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
uuid.workspace = true

[features]
default = ["preview", "ner"]
# Learning apps open in the separate `aiscraft-preview` program (wry webview) when it is
# installed next to `aiscraft`; without this feature, or without the program, in the browser.
preview = []
# Name recognition with a downloaded model (#73). On by default (owner decision 2026-11-25): it adds about 2 MB to the
# program (gline-rs, tokenizers, ort glue; ONNX Runtime itself is never bundled). Build with
# `--no-default-features --features preview` for a build without it.
ner = ["aiscraft-engine/ner"]

[lints]
workspace = true
