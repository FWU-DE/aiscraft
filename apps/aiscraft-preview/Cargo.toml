[package]
name = "aiscraft-preview"
description = "AIS.ChatCraft HTML preview: shows one local learning app in a locked-down webview window, in its own process."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# One window, one webview. The main app stays pure egui; only this separate program links a
# webview (WebKitGTK 4.1 on Linux, WebView2 on Windows, WKWebView on macOS).
wry = "0.57"
tao = "0.37"
serde_json.workspace = true
# The view's network grants follow the engine's rules (layer 0: data only, no I/O).
aiscraft-core.workspace = true

[lints]
workspace = true
