[package]
name = "aiscraft-collab-server"
description = "AIS.ChatCraft collaboration relay: y-sync rooms for documents and whiteboards, join codes, persistence with compaction."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "aiscraft-collab-server"
path = "src/main.rs"

[dependencies]
aiscraft-collab = { path = "../../crates/collab" }
yrs = "0.28"
axum = { version = "0.8", default-features = false, features = ["ws", "json", "query", "tokio", "http1"] }
tokio = { workspace = true, features = ["signal"] }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
clap = { workspace = true, features = ["env"] }
sha2 = "0.10"
getrandom = "0.3"

[dev-dependencies]
reqwest.workspace = true
tokio-tungstenite = "0.30"

[lints]
workspace = true
