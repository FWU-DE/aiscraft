[package]
name = "aiscraft-engine"
description = "AIS.ChatCraft engine: state, the command registry every surface dispatches through, secrets, generation."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aiscraft-core.workspace = true
aiscraft-store.workspace = true
aiscraft-backends.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
futures.workspace = true
tokio.workspace = true
keyring.workspace = true
directories.workspace = true
log.workspace = true
base64 = "0.22"
yrs = "0.28"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
notify-rust = { version = "4", default-features = false, features = ["z"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
aiscraft-board = { path = "../board" }
aiscraft-mcp = { path = "../mcp" }
aiscraft-voice = { path = "../voice" }

[lints]
workspace = true
