[package]
name = "aiscraft-engine"
description = "AIS.ChatCraft engine: state, the command registry every surface dispatches through, secrets, generation."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
craft-atomic.workspace = true
craft-markdown.workspace = true
craft-docx.workspace = true
craft-xlsx.workspace = true
craft-pptx.workspace = true
craft-opc.workspace = true
craft-zip.workspace = true
craft-xml.workspace = true
craft-pdf = { workspace = true, features = ["raster"] }
craft-update.workspace = true
craft-doc-binary.workspace = true
craft-xls.workspace = true
craft-ppt-binary.workspace = true
craft-rtf.workspace = true
craft-epub.workspace = true
craft-html.workspace = true
craft-mime.workspace = true
craft-ical.workspace = true
craft-vcard.workspace = true
craft-csv.workspace = true
craft-ods.workspace = true
craft-metadata.workspace = true
craft-image-codecs.workspace = true
craft-text.workspace = true
aiscraft-core.workspace = true
aiscraft-store.workspace = true
aiscraft-backends.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
futures.workspace = true
tokio.workspace = true
keyring.workspace = true
directories.workspace = true
log.workspace = true
regex.workspace = true
base64 = "0.22"
yrs = "0.28"
hmac = "0.12"
sha1 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
notify-rust = { version = "4", default-features = false, features = ["z"] }
webbrowser = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
aiscraft-board = { path = "../board" }
aiscraft-mcp = { path = "../mcp" }
aiscraft-voice = { path = "../voice" }
aiscraft-collab = { path = "../collab", optional = true }

[features]
default = ["collab", "heif"]
# Live collaboration on artifacts (a plug-in: without it the engine is unchanged).
collab = ["dep:aiscraft-collab"]
# HEIC/HEIF photos (iPhone) through craft-heif. HEVC patents are a distributor's call, so a
# package can leave it out; HEIC files then get a clear message instead.
heif = ["craft-image-codecs/heif"]

[dev-dependencies]
craft-wordmodel.workspace = true
craft-xls = { workspace = true, features = ["test-support"] }
craft-heif = { workspace = true, features = ["test-support"] }
aiscraft-collab-server = { path = "../../apps/aiscraft-collab-server" }

[lints]
workspace = true
