[package]
name = "aiscraft-desktop"
description = "AIS.ChatCraft computer use (#97): programs on this computer through the accessibility APIs (Windows UI Automation), the hard block list and a fake for tests."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aiscraft-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
# UI Automation with safe wrappers (Apache-2.0): reading windows, Invoke/Value/Toggle/Selection/
# ExpandCollapse patterns, keyboard input to the focused window. No screenshot, no mouse.
uiautomation = { version = "0.25", default-features = false, features = ["input", "pattern", "control"] }
# The program behind a window (path of a process id).
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
# Where an installed program lives (App Paths in the registry).
winreg = "0.55"
# Is AIS.ChatCraft itself running with administrator rights? Then nothing is operated.
check_elevation = "0.3"

[lints]
workspace = true
