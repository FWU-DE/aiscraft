[package]
name = "aiscraft-ui"
description = "AIS.ChatCraft egui shell. Thin: every action goes through the engine's commands."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aiscraft-core.workspace = true
aiscraft-engine.workspace = true
egui.workspace = true
eframe.workspace = true
egui_commonmark.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
aiscraft-board = { path = "../board" }
craft-math.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[lints]
workspace = true

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "eframe"] }
eframe = { workspace = true, features = ["wgpu"] }
tokio = { workspace = true }
aiscraft-backends = { workspace = true, features = ["test-support"] }
