[package]
name = "aiscraft-ui"
description = "AISCraft egui shell. Thin: every action goes through the engine's commands."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aiscraft-core.workspace = true
aiscraft-engine.workspace = true
egui.workspace = true
eframe.workspace = true
egui_commonmark.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "eframe"] }
eframe = { workspace = true, features = ["wgpu"] }
tokio = { workspace = true }
