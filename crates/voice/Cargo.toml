[package]
name = "aiscraft-voice"
description = "AIS.ChatCraft speech: microphone recording, playback, speech-to-text and text-to-speech (OpenAI-compatible, AIS.chat)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
aiscraft-core = { path = "../core" }
cpal = "0.18"
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "wav"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
futures = "0.3"
bytes = "1"
serde_json = "1"
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }

[lints]
workspace = true
