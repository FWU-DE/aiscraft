[package]
name = "aiscraft-backends"
description = "AIS.ChatCraft chat backends: AIS.chat (web session), OpenAI-compatible servers, Anthropic."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
craft-atomic.workspace = true
aiscraft-core.workspace = true
aiscraft-rsc.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
reqwest.workspace = true
tokio.workspace = true
log.workspace = true
bytes = "1"
base64 = "0.22"
tokio-tungstenite = "0.30"
# RSA signing of the service account JWT (Vertex). Already in the tree through rustls.
ring = "0.17"

[features]
# The scripted Google of `vertex_fake`, for the engine's tests.
test-support = []

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }

[lints]
workspace = true

# The proxy set in Windows (school networks, Nod 0.9.7 did the same). Only on Windows: on macOS
# reqwest asks the system configuration for every new client, which made short time limits
# (link checks) miss; there and on Linux the HTTP(S)_PROXY variables still apply. Feature
# unification turns it on for every crate's reqwest on Windows.
[target.'cfg(windows)'.dependencies]
reqwest = { workspace = true, features = ["system-proxy"] }
